suite: test model node selector
templates:
  - deployment-vllm-multi.yaml
tests:
  - it: should render a model node selector
    set:
      servingEngineSpec:
        enableEngine: true
        modelSpec:
        - name: "test-model"
          repository: "vllm/vllm-openai"
          tag: "latest"
          modelURL: "facebook/opt-125m"
          replicaCount: 1
          requestCPU: 1
          requestMemory: "1Gi"
          requestGPU: 1
          nodeSelector:
            nvidia.com/gpu.present: "true"
    asserts:
    - equal:
        path: spec.template.spec.nodeSelector
        value:
          nvidia.com/gpu.present: "true"
