suite: test model maximum length
templates:
  - deployment-vllm-multi.yaml
tests:
  - it: should render a large string model length literally
    set:
      servingEngineSpec:
        enableEngine: true
        modelSpec:
        - name: "test-model"
          repository: "vllm/vllm-openai"
          tag: "latest"
          modelURL: "facebook/opt-125m"
          replicaCount: 1
          requestCPU: 1
          requestMemory: "1Gi"
          requestGPU: 1
          vllmConfig:
            maxModelLen: "1048576"
    asserts:
    - contains:
        path: spec.template.spec.containers[0].command
        content: "1048576"
