name: Release downstream vLLM stack

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch whose HEAD will be built
        type: string
        required: false
        default: powerhrg
      output_tag:
        description: Release tag (empty allocates the next powerhrg version)
        type: string
        required: false
        default: ''

concurrency:
  group: powerhrg-release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      source_version: ${{ steps.prepare.outputs.source_version }}
      image_tag: ${{ steps.prepare.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preflight and freeze release inputs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ inputs.source_branch || 'powerhrg' }}
          OUTPUT_TAG: ${{ inputs.output_tag }}
        run: |
          python3 scripts/powerhrg_release.py prepare \
            --source-branch "$SOURCE_BRANCH" --output-tag "$OUTPUT_TAG" \
            --state "$RUNNER_TEMP/release-state.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-state
          path: ${{ runner.temp }}/release-state.json
          if-no-files-found: error
          retention-days: 7

  images:
    needs: prepare
    runs-on: self-hosted
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - component: router
            context: source
            package: router
          - component: operator
            context: source/operator
            package: production-stack-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Inspect build tools and storage
        run: |
          docker info --format '{{.DockerRootDir}}'
          docker buildx version
          df -h "$RUNNER_TEMP"
      - name: Build once and export the image
        env:
          COMPONENT: ${{ matrix.component }}
          CONTEXT: ${{ matrix.context }}
          IMAGE: ghcr.io/powerhome/vllm-production-stack/${{ matrix.package }}:${{ needs.prepare.outputs.image_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          docker buildx build --builder default --platform linux/amd64 --load \
            --file "tooling/docker/Dockerfile.$COMPONENT-release" \
            --build-arg "SOURCE_VERSION=$SOURCE_VERSION" \
            --label org.opencontainers.image.source=https://github.com/powerhome/vllm-production-stack \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            --tag "$IMAGE" "$CONTEXT"
          docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/packages/$COMPONENT-$IMAGE_TAG.tar.gz"
          python3 tooling/scripts/powerhrg_release.py split-archive \
            --component "$COMPONENT" --archive "$RUNNER_TEMP/packages/$COMPONENT-$IMAGE_TAG.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.component }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  chart:
    needs: prepare
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-state
          path: ${{ runner.temp }}
      - name: Package and validate the downstream chart
        run: |
          python3 tooling/scripts/powerhrg_release.py install-helm --destination "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/packages"
          python3 tooling/scripts/powerhrg_release.py stage-chart \
            --source source --state "$RUNNER_TEMP/release-state.json" \
            --destination "$RUNNER_TEMP/chart" --packages "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-chart
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, images, chart]
    runs-on: self-hosted
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Inspect publication storage
        run: |
          docker info --format '{{.DockerRootDir}}'
          df -h "$RUNNER_TEMP"
      - name: Publish images, chart and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/powerhrg_release.py install-helm --destination "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 scripts/powerhrg_release.py publish \
            --state "$RUNNER_TEMP/packages/release-state.json" \
            --packages "$RUNNER_TEMP/packages"
